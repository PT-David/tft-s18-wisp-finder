name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:build:18.1
      - run: npm run data:audit:18.1
      - run: npm run validate:lexicon-decisions
      - run: npm run data:materialize-search:18.1
      - run: npm run validate:materialized-search
      - run: npm run data:publish-search:18.1
      - run: npm run validate:runtime-search
      - run: npm run validate:seed
      - run: npm run validate:data
      - run: npm run validate:rules
      - run: npm run data:release-audit:18.1
      - run: npm run validate:release-audit
      # C4.2A1/A2 and C4.2B1 are frozen pre-Apply review artifacts. Their
      # internal governance remains covered by unit tests; do not regenerate
      # them from post-Apply production or enforce their old 169 fingerprints.
      - run: npm run data:catalog-delta-reconciliation:18.1
      - run: npm run validate:catalog-delta-reconciliation
      - run: npm run validate:c4.2a-identity-decisions
      - run: npm run validate:c4.2b-field-decisions
      - run: npm run validate:c4.2b3-required-fields
      - run: npm run validate:c4.2b4-final-fields
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: git diff --exit-code
