name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:build:18.1
      - run: npm run data:audit:18.1
      - run: npm run data:lexicon:18.1
      - run: npm run validate:lexicon-decisions
      - run: npm run data:materialize-search:18.1
      - run: npm run validate:materialized-search
      - run: npm run data:publish-search:18.1
      - run: npm run validate:runtime-search
      - run: npm run validate:seed
      - run: npm run validate:data
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: git diff --exit-code
